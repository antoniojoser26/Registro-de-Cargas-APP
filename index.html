<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DDE8FF">
<meta name="description" content="Registro de entrenamientos de fuerza, composición corporal, nutrición y entrenador con IA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>App Registro de Cargas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Siempre en modo claro, también si el móvil está en modo oscuro.
   Layout: app de una columna, pensada para el móvil en el gimnasio; barra de pestañas fija abajo. Colores de los discos olímpicos: azul 20 kg (acento, peso), rojo 25 kg (grasa), verde 10 kg (músculo), amarillo 15 kg (IMC / hidratos). */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --sunk:#E4E9F2; --ink:#10162A; --muted:#55607A; --line:#D3DAE6;
  --accent:#1D4ED8; --accent-2:#3B6CF6; --accent-soft:#DCE6FF; --on-accent:#FFFFFF;
  --plate-red:#D2342A; --plate-yellow:#E7A817; --plate-green:#16955A; --plate-blue:#1D4ED8;
  --good:#16834F; --good-soft:#D6F2E3; --warn:#A8670A; --warn-soft:#FCEBCB; --red-soft:#FBDDDA; --yellow-soft:#FDF0C9;
  --hero-1:#13234F; --hero-2:#1D4ED8; --on-hero:#FFFFFF; --on-hero-muted:#B9C8F5;
  --shadow:0 1px 2px rgba(16,22,42,.06),0 6px 18px rgba(16,22,42,.08); --shadow-lg:0 10px 30px rgba(16,22,42,.16);
  --f-display:"Rubik","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Rubik","Noto Sans",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin-bottom:14px}
section+section{margin-top:26px}

/* controles */
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--plate-red)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea.input{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* pills de estado */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.up{background:var(--red-soft);color:var(--plate-red)}
.pill.keep{background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* registro */
.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daypick button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;min-width:120px}
.daypick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.daypick b{display:block;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.daypick span{font-size:12px;color:var(--muted)}
.daypick .next{color:var(--accent);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-h h3{font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:0;line-height:1.3}
.ex-meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex-tip{font-size:13px;margin-top:6px;color:var(--ink);background:var(--sunk);border-radius:6px;padding:5px 8px}
.sets .step button{width:30px}
.sets .step input{font-size:15px}
.sets{display:grid;grid-template-columns:18px 58px minmax(0,1fr) minmax(0,1fr);column-gap:6px;gap:6px 8px;align-items:center;margin-top:12px}
.sets .hd{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.sets .n{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;background:var(--surface)}
.step button{border:0;background:var(--sunk);width:38px;font-size:18px;font-weight:600;flex:0 0 auto}
.step input{border:0;background:transparent;text-align:center;width:100%;min-width:0;padding:8px 2px;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.step input::placeholder{color:var(--muted);opacity:.6}
.feel{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.feel .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.addset{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 0}
.savebar{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.10)}

/* rutina */
.day{border-top:1px solid var(--line);padding-block:14px}
.day:first-of-type{border-top:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.extable{width:100%;border-collapse:collapse;font-size:14px}
.extable td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.extable tr:first-child td{border-top:0}
.extable td.r{text-align:right;white-space:nowrap}
.extable .nm{font-weight:600}
.extable .sub{font-size:12.5px;color:var(--muted)}
.editbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:2px 0}
.tbl-wrap{overflow-x:auto}
.ref{width:100%;border-collapse:collapse;font-size:13.5px}
.ref th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ref td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .d{font-size:12.5px;margin-top:4px;font-family:var(--f-mono)}
.d.pos{color:var(--good)} .d.neg{color:var(--plate-red)} .d.neu{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.hist{display:flex;flex-direction:column}
.hist .it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.hist .it:first-child{border-top:0}
details.sess{border-top:1px solid var(--line);padding-block:10px}
details.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sess summary::-webkit-details-marker{display:none}
.sess ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:220px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p,.msg.a p+ol,.msg.a ol+p{margin-top:8px}
.msg.a ul,.msg.a ol{margin:6px 0;padding-left:20px}
.msg.a .h{font-weight:600;margin-top:8px}
.msg.think{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.composer .box{display:flex;gap:6px;align-items:flex-end}
.iconbtn{flex:0 0 auto;width:44px;height:46px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.ideas{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:38vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.10)}
.ideas button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 14px;font-size:14px}
.ideas button:first-child{border-top:0}
.ideas button:hover{background:var(--sunk)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px;padding:0}
.imgnote{font-size:12px;opacity:.85;margin-top:4px}
.composer textarea{flex:1;min-height:46px;max-height:160px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;color:var(--muted);font-size:10px;letter-spacing:-.01em;font-weight:600;white-space:nowrap;min-width:0;overflow:hidden}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:500;z-index:9;max-width:calc(100% - 32px)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwh{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:62px;padding:4px 3px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0;overflow:hidden}
.cday.past{opacity:.6}
.cday.out{opacity:.35}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthnav .mname{flex:1;text-align:center;font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase}
.monthnav .btn{min-width:44px;font-size:20px;padding:4px 10px}
.monthnav .btn.small{font-size:14px}
.cday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday.sel{background:var(--accent-soft)}
.cday .dn{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
.cday .tags{display:flex;gap:2px;flex-wrap:wrap}
.cday .tr{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
i.sh{font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;line-height:15px;display:inline-block}
i.sh.M{background:var(--accent-soft);color:var(--accent)}
i.sh.T{background:var(--warn-soft);color:var(--warn)}
i.sh.tele{background:var(--good-soft);color:var(--good)}
i.sh.off{background:var(--sunk);color:var(--muted)}
i.sh.weigh{background:var(--red-soft);color:var(--plate-red)}
i.sh.N{background:var(--sunk);color:var(--ink)}
.shrow{display:grid;grid-template-columns:58px minmax(0,1fr) auto minmax(0,1fr) 28px;gap:6px;align-items:center}
.shrow .input{padding-inline:6px;min-width:0}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.kpi.goal .v{font-size:28px}
.kpi.goal .gt{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:600}
.vex{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:6px}
.vex:first-of-type{border-top:0}
.vitem{background:var(--sunk);border-radius:8px;padding:8px 10px}
.vadd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:4px}
.vlinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vlinks a,.vlinks button{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:4px 10px;text-decoration:none}
.nutbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.nutbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.nutbar i.over{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.msg,.ex{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

/* ---------- capa visual: relieve y color ---------- */
.top{position:relative;margin-inline:-16px;padding:22px 16px 20px;margin-top:-16px;margin-bottom:20px;background:linear-gradient(135deg,var(--hero-1),var(--hero-2));color:var(--on-hero);border-radius:0 0 22px 22px;box-shadow:var(--shadow-lg);overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:18px solid rgba(255,255,255,.07);box-shadow:0 0 0 22px rgba(255,255,255,.04);pointer-events:none}
.top > *{position:relative;z-index:1}
.top h1{color:var(--on-hero);font-size:32px}
.top .eyebrow{color:var(--on-hero-muted)}
.top .seg{background:rgba(255,255,255,.14)}
.top .seg button{color:var(--on-hero-muted)}
.top .seg button[aria-pressed="true"]{background:#fff;color:#10162A}
.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:var(--on-hero)}
.top .btn.danger{background:var(--plate-red);border-color:var(--plate-red);color:#fff}
h2{display:flex;align-items:center;gap:8px}
section > h2::before,section > .row > h2::before,.day-h h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);flex:0 0 auto}
.panel,.ex,.kpi,.daypick button,.msg.a,.cday,.ideas{box-shadow:var(--shadow);border-color:transparent}
.panel,.ex{border-radius:14px}
.btn{box-shadow:0 1px 2px rgba(16,22,42,.08)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);box-shadow:0 4px 12px rgba(29,78,216,.35)}
.btn.primary:disabled{box-shadow:none}
.chip[aria-pressed="true"]{box-shadow:0 3px 10px rgba(29,78,216,.30)}
.seg{background:var(--sunk)}
/* registrar */
.ex-h h3{font-size:16.5px}
.ex{border-top:4px solid var(--accent)}
.step{border-color:var(--line);box-shadow:inset 0 1px 2px rgba(16,22,42,.05)}
.step button{background:var(--accent-soft);color:var(--accent)}
.step button:active{background:var(--accent);color:var(--on-accent)}
.sets .n{color:var(--accent)}
.daypick button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 6px 16px rgba(29,78,216,.35)}
.daypick button[aria-pressed="true"] span,.daypick button[aria-pressed="true"] .next{color:var(--on-accent);opacity:.9}
.daypick button.done{background:var(--good-soft);border-color:var(--plate-green);box-shadow:inset 0 0 0 1px var(--plate-green)}
.daypick button.done span{color:var(--good);font-weight:600}
.daypick button.done b{color:var(--good)}
.daypick button.done[aria-pressed="true"]{background:linear-gradient(135deg,#25b06f,var(--plate-green));color:#fff;box-shadow:0 6px 16px rgba(22,149,90,.35)}
.daypick button.done[aria-pressed="true"] span,.daypick button.done[aria-pressed="true"] b{color:#fff}
.prv{display:flex;align-items:baseline;justify-content:center;gap:1px;min-height:40px;align-self:stretch;align-items:center;border-radius:8px;background:var(--sunk);font-size:14px;color:var(--ink);padding:0 4px;white-space:nowrap}
.prv b{font-weight:700}
.prv span{color:var(--muted);font-size:13px}
.prv.up{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--plate-green)}
.prv.up b,.prv.up span{color:var(--good)}
.prv.eq{box-shadow:inset 0 0 0 2px var(--line)}
.prv.down{background:var(--yellow-soft)}
.prevcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;border-left:5px solid var(--plate-yellow)}
.prevcard summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.prevcard summary::-webkit-details-marker{display:none}
.prevcard .pt{font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin-top:2px}
.prevcard .pt .muted{font-family:var(--f-body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0}
.prevcard .chev{font-size:18px;color:var(--muted);transition:transform .15s}
.prevcard[open] .chev{transform:rotate(180deg)}
.prevlist{margin-top:8px}
.prow{border-top:1px solid var(--line);padding:8px 0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pnote{color:var(--muted);font-size:12.5px;margin-top:4px}
.prow .pn{font-weight:600;font-size:14px;min-width:0}
.prow .ps{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.sx{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px;font-size:13px;font-weight:600}
.sx i{font-style:normal;opacity:.6;margin:0 1px}
.empty-prev{border-left-color:var(--line)}
.ex-tip{background:var(--yellow-soft);border-left:3px solid var(--plate-yellow)}
.feel .chip[data-v="Fácil"][aria-pressed="true"]{background:var(--plate-green);border-color:var(--plate-green)}
.feel .chip[data-v="Bien"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.feel .chip[data-v="Duro"][aria-pressed="true"]{background:var(--plate-yellow);border-color:var(--plate-yellow);color:#10162A}
.feel .chip[data-v="Al fallo"][aria-pressed="true"]{background:var(--plate-red);border-color:var(--plate-red)}
.savebar{border:0;box-shadow:var(--shadow-lg)}
/* pills */
.pill.up{background:var(--plate-red);color:#fff}
.pill.good{background:var(--plate-green);color:#fff}
.pill.warn{background:var(--plate-yellow);color:#10162A}
/* KPIs con color de disco: 1 azul, 2 rojo, 3 verde, 4 amarillo */
.kpi{position:relative;border-radius:14px;overflow:hidden;padding-top:14px}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--kc,var(--accent))}
.kpis .kpi:nth-child(1),.goals .kpi:nth-child(1){--kc:var(--plate-blue)}
.kpis .kpi:nth-child(2),.goals .kpi:nth-child(2){--kc:var(--plate-red)}
.kpis .kpi:nth-child(3),.goals .kpi:nth-child(3){--kc:var(--plate-green)}
.kpis .kpi:nth-child(4){--kc:var(--plate-yellow)}
.kpi .v{color:var(--ink)}
.kpi .nutbar i,.kpi.goal .nutbar i{background:var(--kc,var(--accent))}
.kpi .nutbar i.over{background:repeating-linear-gradient(45deg,var(--plate-yellow) 0 6px,var(--warn) 6px 12px)}
.nutbar{height:10px;border-radius:5px}
/* gráficas */
.chart .area{fill-opacity:.22}
/* calendario */
.cday{border:1px solid transparent}
.cday.today{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.cday.sel{background:var(--accent-soft)}
i.sh{line-height:16px;padding:0 5px}
i.sh.M{background:var(--plate-blue);color:#fff}
i.sh.T{background:var(--plate-yellow);color:#10162A}
i.sh.N{background:#3B3F5C;color:#fff}
i.sh.tele{background:var(--plate-green);color:#fff}
i.sh.weigh{background:var(--plate-red);color:#fff}
i.sh.off.vac{background:#7C3AED;color:#fff}
/* chat */
.msg.u{background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 4px 12px rgba(29,78,216,.25)}
.msg.a{border-left:3px solid var(--plate-green)}
.composer{background:linear-gradient(to top,var(--bg) 70%,transparent)}
/* barra inferior */
nav.tabs{border-top:0;box-shadow:0 -4px 20px rgba(16,22,42,.10)}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.2}
.empty{background:var(--surface);border:2px dashed var(--line)}
.banner{border-left:4px solid var(--plate-yellow)}

/* ---------- tema tipo Samsung Health / One UI ----------
   Fondo gris claro con degradado suave arriba, tarjetas blancas muy redondeadas sin borde,
   títulos grandes a la izquierda, colores por métrica (actividad verde, composición azul,
   nutrición naranja, IMC morado) y botón «+» de añadir rápido. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#EEF0F5; --ink:#141414; --muted:#6B6F7B; --line:#E6E8EE;
  --accent:#3E7BFA; --accent-2:#5B8FFF; --accent-soft:#E6EEFF; --on-accent:#FFFFFF;
  --plate-blue:#3E7BFA; --plate-red:#FF7A45; --plate-green:#2DBE7E; --plate-yellow:#F5A623; --plate-purple:#8B6CF6;
  --good:#1FA567; --good-soft:#E2F6EC; --warn:#C27C0E; --warn-soft:#FFF1D9; --red-soft:#FFE9E0; --yellow-soft:#FFF5DE;
  --shadow:0 1px 3px rgba(20,20,40,.05); --shadow-lg:0 8px 24px rgba(20,20,40,.10); --r:22px;
}
body{background:linear-gradient(180deg,#DDE8FF 0,#EEF1FB 220px,var(--bg) 420px) no-repeat,var(--bg)}
.wrap{padding-block:8px 140px}
/* cabecera: título grande a la izquierda, sin bloque de color */
.top{background:none;box-shadow:none;color:var(--ink);margin:0 0 14px;padding:34px 2px 6px;border-radius:0;overflow:visible}
.top::after{display:none}
.top h1{color:var(--ink);font-size:30px;font-weight:700;letter-spacing:-.01em}
.top .eyebrow{color:var(--muted);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.top .seg{background:#E4E7EF}
.top .seg button{color:var(--muted)}
.top .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.top .btn{background:#fff;border-color:transparent;color:var(--ink)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:13px}
h2{font-family:var(--f-display);font-weight:600}
section > h2::before,section > .row > h2::before,.day-h h2::before{display:none}
/* tarjetas */
.panel,.ex,.kpi,.prevcard,.msg.a,.ideas,.daypick button,.cday,.empty{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.ex{border-top:0;padding:16px}
.prevcard{border-left:0}
.kpi{padding:14px 16px}
.kpi::before{display:none}
.kpi .eyebrow{display:flex;align-items:center;gap:6px;color:var(--muted)}
.kpi .eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--kc,var(--accent))}
.kpi .v{font-size:30px}
.kpis .kpi:nth-child(1),.goals .kpi:nth-child(1){--kc:var(--plate-blue)}
.kpis .kpi:nth-child(2),.goals .kpi:nth-child(2){--kc:var(--plate-red)}
.kpis .kpi:nth-child(3),.goals .kpi:nth-child(3){--kc:var(--plate-green)}
.kpis .kpi:nth-child(4){--kc:var(--plate-purple)}
.nutbar{height:8px;border-radius:4px;background:var(--sunk)}
.empty{background:var(--surface)}
/* botones y controles */
.btn{border-radius:999px;border:0;background:#fff;box-shadow:var(--shadow);font-weight:600}
.btn.primary{background:var(--accent);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none}
.chip{border:0;background:#fff;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{box-shadow:none}
.input,select.input,textarea.input{border:0;background:var(--sunk);border-radius:14px}
.step{border:0;background:var(--sunk);border-radius:14px;box-shadow:none}
.step button{background:transparent;color:var(--accent);font-size:20px}
.step input{background:transparent}
.seg{border-radius:999px;padding:3px}
.seg button{border-radius:999px}
.daypick button{min-width:116px;padding:10px 14px}
.daypick button[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px rgba(62,123,250,.30)}
.daypick button.done{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--plate-green)}
.daypick b{font-family:var(--f-display);text-transform:none;font-size:16px}
.prv{border-radius:12px}
.pill{border-radius:999px}
.ex-tip{border-left:0;border-radius:12px}
/* agenda */
.cday{min-height:64px;border-radius:14px}
.monthnav .mname{text-transform:none;font-size:20px}
/* chat */
.msg.u{background:var(--accent);box-shadow:none;border-radius:20px 20px 6px 20px}
.msg.a{border-left:0;border-radius:20px 20px 20px 6px}
/* barra inferior tipo One UI */
nav.tabs{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 -1px 0 var(--line)}
nav.tabs button{color:#8A8E99;font-weight:500}
nav.tabs button[aria-current="page"]{background:none;color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.2}
/* botón «+» y hoja de añadir rápido */
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;line-height:58px;box-shadow:0 8px 22px rgba(62,123,250,.45);z-index:6;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:7}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.15);max-width:760px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5D8E0;margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:18px;margin:0 0 10px 4px}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{border:0;background:var(--sunk);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px;color:var(--ink);cursor:pointer}
.qa .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.qa .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* resumen semanal con anillo */
.weekcard{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.weekcard .ring{flex:0 0 auto}
.weekcard .wt{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.weekcard .wt small{font-size:15px;color:var(--muted);font-weight:600}
.wdots{display:flex;gap:6px;margin-top:8px}
.wdots span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted)}
.wdots span.on{background:var(--plate-green);color:#fff}
.wdots span.today{box-shadow:0 0 0 2px var(--accent)}
.wmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.wmeta b{color:var(--ink)}

/* One UI: sin mayúsculas forzadas en títulos */
.daypick b,.prevcard .pt{text-transform:none;letter-spacing:0}
.monthnav .mname{text-transform:capitalize}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px}
.extable{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-collapse:separate;overflow:hidden;border-spacing:0}
.extable td{padding-left:16px;padding-right:16px}
.day-h h2{flex:1;min-width:0}

/* EVOLT */
.evhero{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.evscore{position:relative;width:96px;height:96px;flex:0 0 96px}
.evring{width:96px;height:96px}
.evin{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:30px}
.evin b{font-family:var(--f-display);font-size:28px;font-weight:700}.evin small{font-size:13px;color:var(--muted);font-weight:600}
.evbig{font-family:var(--f-display);font-size:24px;font-weight:700;margin:2px 0}
.evsum{margin-top:12px}.evsum ul{margin:0;padding-left:18px;display:grid;gap:6px;line-height:1.5}
.evlist{padding-block:4px}
.evrow{padding:12px 0;border-bottom:1px solid var(--line)}.evrow:last-child{border-bottom:0}
.evh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.evv{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.evv .num{font-family:var(--f-display);font-size:22px;font-weight:700}.evv small{color:var(--muted);font-weight:600;margin-right:6px}
.evbar{position:relative;height:8px;border-radius:99px;background:var(--sunk);margin-top:12px}
.evbar .zone{position:absolute;top:0;bottom:0;background:var(--good-soft);border-radius:99px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 35%,transparent)}
.evbar .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);background:var(--good)}
.evbar .dot.warn{background:var(--warn)}.evbar .dot.up{background:var(--plate-red)}.evbar .dot.keep{background:var(--muted)}
.evscale{position:relative;height:16px;font-size:11px;color:var(--muted)}.evscale i{position:absolute;font-style:normal;transform:translateX(-50%);top:2px}
.evlevels{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:10px}
.evlevels span{height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;opacity:.35}
.evlevels .o{background:var(--good)}.evlevels .b{background:var(--plate-green)}.evlevels .x{background:var(--plate-red)}
.evlevels .on{opacity:1;transform:scaleY(1.25);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.evlevels .b{background:#7CC9A0}
.evsplit{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding-top:10px}
.evsplit b.num{font-family:var(--f-display);font-size:20px}
.evbody{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evzone{background:var(--sunk);border-radius:16px;padding:10px 12px;display:grid;gap:3px}
.evzone.tr{grid-column:1/-1}
.evwater{display:flex;border-radius:12px;overflow:hidden;font-size:12px;font-weight:600;color:#fff}
.evwater span{padding:10px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evwater span:first-child{background:var(--plate-blue)}.evwater span:last-child{background:#7FA8FF}
.evmac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.evmac>div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;border-left:4px solid var(--kc,var(--plate-green))}
.evmac b{font-family:var(--f-display);font-size:17px}.evmac small{color:var(--muted);font-size:12px}
nav.tabs{padding-left:4px;padding-right:4px}
nav.tabs button{font-size:10px;letter-spacing:-.02em}

/* comida de hoy en el entrenador */
.foodcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.fms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fm .fl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fm .fl b{font-family:var(--f-display);font-size:17px;color:var(--ink)}.fm .fl small{font-size:11px;color:var(--muted);font-weight:600}
.fm .fb{height:8px;border-radius:99px;background:var(--sunk);margin-top:5px;overflow:hidden}.fm .fb i{display:block;height:100%;border-radius:99px;background:var(--kc)}
.fm .fr{margin-top:3px;color:var(--muted)}.fm .fr.bad{color:var(--plate-red)}

.foodcard.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:4;padding:8px 10px}
.foodcard.sticky.open{padding:14px;max-height:70vh;overflow:auto}
.foodbar{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 16px;gap:8px;align-items:end;width:100%}
.foodbar:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.fmini{display:grid;gap:2px;min-width:0}.fmini b{font-family:var(--f-display);font-size:15px}.fmini small{font-size:10.5px;color:var(--muted);font-weight:600}
.fmini>i{display:block;height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}.fmini>i>i{display:block;height:100%;background:var(--kc);border-radius:99px}
.fmini em{font-style:normal;font-size:10.5px;color:var(--muted)}
.foodbar .chev{color:var(--muted);font-size:13px;align-self:center}
.foodttl{all:unset;cursor:pointer}
.thumb{position:relative}.ocrst{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);border-radius:6px;padding:1px 5px}
.ocrst.done{color:var(--good)}.ocrst.error,.ocrst.empty{color:var(--plate-red)}

/* calentamiento y estiramientos */
.mobcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.mobcard summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.mobcard summary::-webkit-details-marker{display:none}
.mobcard .mobic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:color-mix(in srgb,var(--plate-yellow) 18%,transparent);flex:0 0 36px}
.mobcard.stretch .mobic{background:color-mix(in srgb,var(--plate-purple) 16%,transparent)}
.mobcard .mobic svg{width:20px;height:20px;fill:none;stroke:var(--plate-yellow);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.mobcard.stretch .mobic svg{stroke:var(--plate-purple)}
.mobcard .mobt{flex:1;min-width:0;display:flex;flex-direction:column}
.mobcard .chev{color:var(--muted);transition:transform .15s}.mobcard[open] .chev{transform:rotate(180deg)}
.moblist{display:grid;gap:6px;margin-top:10px}
.mobit{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.mobit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mobit .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:var(--surface)}
.mobit.on .ck{background:var(--good);border-color:var(--good)}.mobit.on .mn{color:var(--muted);text-decoration:line-through}
.mobit .mn{min-width:0;font-weight:500}.mobit .md{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mobblk{margin-bottom:10px}.mobul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.mobul li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}.mobul li:last-child{border-bottom:0}
.mobrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,130px) 40px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mobrow>input:first-child{grid-column:1/-1}
.mobrow .btn{min-width:0;padding:4px}
.mobdays{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.mobdays .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}

/* pulso */
.hrbox{margin-top:10px;background:var(--sunk);border-radius:16px;padding:12px}
.hrnums{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}.hrnums span{display:flex;align-items:baseline;gap:4px}.hrnums b{font-family:var(--f-display);font-size:19px}.hrnums small{color:var(--muted);font-size:12px}
.hrseg{margin-top:6px;padding-left:10px;border-left:4px solid var(--kc);font-size:14px}.hrseg .eyebrow{margin-right:6px}.hrseg small{color:var(--muted)}
.hrzones{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:10px;font-size:10.5px;font-weight:700;color:#fff}
.hrzones span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.hrzones .z1{background:#9AA5B8}.hrzones .z2{background:var(--plate-blue)}.hrzones .z3{background:var(--plate-green)}.hrzones .z4{background:var(--plate-yellow)}.hrzones .z5{background:var(--plate-red)}
.hrphotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hrph{all:unset;cursor:pointer;display:block;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--surface)}
.hrph img{width:100%;height:100%;object-fit:cover;display:block}.hrph.big{width:100%;height:auto}.hrph.big img{height:auto;object-fit:contain}
.hrask{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;border-left:4px solid var(--plate-red)}
.hrdot{color:var(--plate-red)}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div><div class="eyebrow">Fuerza · progreso · nutrición</div><h1>Registro de Cargas</h1></div></div>
  <div class="empty">Cargando tu rutina, tus mediciones y tu historial…</div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="fabwrap"></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

  const t = todayISO(), mon = isoAdd(t, -((wdOf(t) + 6) % 7)), sun = isoAdd(mon, 6), out = new Set();
  for (const l of S.logs) {
    if (!l.date || l.date < mon || l.date > sun) continue;
    const i = (S.plans[l.place]?.days || []).findIndex(d => d.name === l.day);
    if (i >= 0) out.add(i);

}

/* ---------- gráficas ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(4));
  return t;
}
function lineChart(pts, {unit = "", dec = 1, color = "var(--accent)"} = {}) {
  if (pts.length < 1) return `<div class="empty">Sin datos todavía.</div>`;
  const W = 640, H = 230, L = 46, R = 18, T = 14, B = 30;
  const xs = pts.map(p => new Date(p.x + "T00:00").getTime()), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys)); const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${path}L${X(xs[xs.length - 1]).toFixed(1)},${Y(y0)}L${X(xs[0]).toFixed(1)},${Y(y0)}Z`;
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t, dec)}</text>`).join("");
  const nx = Math.min(pts.length, 5), xl = [];
  for (let k = 0; k < nx; k++) { const i = nx === 1 ? 0 : Math.round(k * (pts.length - 1) / (nx - 1)); if (!xl.includes(i)) xl.push(i); }
  const xlab = xl.map((i, k) => `<text x="${X(xs[i])}" y="${H - 8}" text-anchor="${k === 0 && xl.length > 1 ? "start" : k === xl.length - 1 && xl.length > 1 ? "end" : "middle"}">${fmtDate(pts[i].x)}</text>`).join("");
  const dots = pts.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? color : "var(--surface)"}" stroke="${color}" stroke-width="2"><title>${fmtDate(p.x)}: ${fmtN(p.y, dec)} ${unit}${p.src ? " · " + p.src : ""}</title></circle>`).join("");
  const last = pts[pts.length - 1];
  const lx = X(xs[xs.length - 1]), anchor = lx > W - 90 ? "end" : "start";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">${grid}<path class="area" d="${area}" fill="${color}" fill-opacity=".18"/><path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${anchor === "end" ? lx - 9 : lx + 9}" y="${Y(last.y) - 9}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:600">${fmtN(last.y, dec)} ${unit}</text>${xlab}</svg>`;
}

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ""));
}
function shTable(text) {
  let rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length && /^com\.samsung/i.test(rows[0][0]) && rows[0].length < 5) rows = rows.slice(1); // línea de metadatos
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().split(".").pop().toLowerCase());
  return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
function shDate(v) {
  if (v == null || v === "") return null;
  if (/^\d{11,}$/.test(String(v).trim())) { const d = new Date(+v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}
async function importSamsung(files) {
  const texts = []; // [{name, text}]
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) { toast("No se pudo abrir el ZIP. Descomprímelo y elige los CSV."); continue; }
      const zip = await JSZip.loadAsync(f);
      for (const [name, entry] of Object.entries(zip.files)) if (!entry.dir && /(step_daily_trend|pedometer_day_summary|health\.nutrition)[^/]*\.csv$/i.test(name)) texts.push({name, text: await entry.async("string")});
    } else if (/\.csv$/i.test(f.name)) texts.push({name: f.name, text: await f.text()});
  }
  const days = {}; const day = d => days[d] ||= {date: d};
  let steps = 0, meals = 0;
  const hasTrend = texts.some(t => /step_daily_trend/i.test(t.name));
  for (const {name, text} of texts) {
    const rows = shTable(text);
    if (/step_daily_trend/i.test(name) || (!hasTrend && /pedometer_day_summary/i.test(name))) {
      for (const r of rows) { const d = shDate(r.day_time || r.create_time); const n = parseInt(r.count ?? r.step_count); if (!d || isNaN(n)) continue; const o = day(d); o.steps = Math.max(o.steps || 0, n); steps++; }
    } else if (/health\.nutrition/i.test(name)) {
      for (const r of rows) { const d = shDate(r.start_time || r.create_time); if (!d) continue; const o = day(d); meals++;
        for (const [k, col] of [["kcal", "calorie"], ["protein", "protein"], ["fat", "total_fat"], ["carbs", "carbohydrate"]]) { const n = parseFloat(r[col]); if (!isNaN(n)) o[k] = (o[k] || 0) + n; } }
    }
  }
  const cutoff = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const list = Object.values(days).filter(d => d.date >= cutoff && d.date <= todayISO());
  return {list, steps, meals, files: texts.length};
}

const GOAL_M = {weight: ["Peso", "kg", 1], fat: ["Grasa corporal", "%", 1], muscle: ["Masa muscular", "kg", 1]};
function goalSeries(metric, src) { return [...S.body].filter(b => b[metric] != null && (!src || b.source === src)).sort((a, b) => a.date.localeCompare(b.date)); }
function goalTrend(metric, src) {
  const recent = goalSeries(metric, src).filter(p => p.date >= isoAdd(todayISO(), -120));
  if (recent.length < 2) return null;
  const x = recent.map(p => new Date(p.date + "T00:00").getTime() / 864e5), y = recent.map(p => +p[metric]);
  if (x[x.length - 1] - x[0] < 7) return null;
  const mx = x.reduce((a, b) => a + b, 0) / x.length, my = y.reduce((a, b) => a + b, 0) / y.length;
  let num = 0, den = 0; x.forEach((xi, i) => { num += (xi - mx) * (y[i] - my); den += (xi - mx) ** 2; });
  return den ? num / den : null; // unidades por día
}
function goalInfo(metric) {
  const g = S.profile?.goals || {}, target = g[metric]; if (target == null || target === "") return null;
  const src = g.source || "", ser = goalSeries(metric, src); if (!ser.length) return {metric, target, empty: true};
  const start = ser[0][metric], cur = ser[ser.length - 1][metric], dir = Math.sign(target - start) || Math.sign(target - cur) || 1;
  const done = (cur - target) * dir >= 0, slope = goalTrend(metric, src);
  const pct = start === target ? 100 : Math.max(0, Math.min(100, (cur - start) / (target - start) * 100));
  let eta = null; if (!done && slope && Math.sign(slope) === Math.sign(target - cur)) eta = isoAdd(todayISO(), Math.ceil((target - cur) / slope));
  let need = null; if (!done && g.date && g.date > todayISO()) need = (target - cur) / ((new Date(g.date) - new Date(todayISO())) / 864e5);
  return {metric, target, start, cur, startDate: ser[0].date, curDate: ser[ser.length - 1].date, done, pct, slope, eta, need};
}

/* Lector de la hoja de resultados EVOLT 360. El PDF trae los valores sin etiquetas, en el orden de la hoja

function parseEvolt(raw) {
  let t = String(raw || "").replace(/\\/g, "").replace(/ /g, " ");

  if ((m = t.match(/(\d{3}(?:\.\d)?)\s*cm\s+(\d{2,3}(?:\.\d+)?)\s*kg\s+(\d{1,3})\s+(Male|Female|Hombre|Mujer)/i))) { out.height = n(m[1]); out.weight = n(m[2]); out.age = n(m[3]); out.gender = /^(female|mujer)/i.test(m[4]) ? "Mujer" : "Hombre"; }

    .map(x => ({v: n(x[1]), st: x[3], min: x[4] != null ? n(x[4]) : null, max: x[5] != null ? n(x[5]) : null}));
  const T2 = [...t.matchAll(/(\d+(?:\.\d+)?)\s*\[\s*(\d+(?:\.\d+)?)\s*%\s*\]/g)].map(x => ({v: n(x[1]), pct: n(x[2])}));
  const T3 = [...t.matchAll(/(\d{3,5})\s*kcal/gi)].map(x => n(x[1]));
  // Cuadrícula principal: fila 1 (magra, grasa, nivel visceral), 2 (músculo), 3 (proteína), 4 (minerales, área visceral), 5 (agua, % grasa)
  const main = ["lbm", "bfm", "vfl", "smm", "protein", "minerals", "vfa", "tbw", "bfp"];
  if (T1.length >= 9) main.forEach((k, i) => out[k] = T1[i]);

  if (T3.length >= 2) { out.bmr = T3[0]; out.tee = T3[1]; }

}

const EVOLT_REQ = ["date", "weight", "lbm", "bfm", "smm", "bfp", "tbw"];
function evoltProblems(e) {
  const p = EVOLT_REQ.filter(k => e[k] == null);

  if (Math.abs(e.lbm.v + e.bfm.v - e.weight) > 0.6) p.push("magra + grasa ≠ peso");
  if (Math.abs(e.bfm.v / e.weight * 100 - e.bfp.v) > 1.2) p.push("% grasa");

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

/* Texto en orden de lectura: agrupa los fragmentos por fila (misma altura) y los ordena de izquierda a derecha. */
async function pdfText(file) {
  const lib = await loadPdfJs(), pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise; let out = "";
  for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
    const items = (await (await pdf.getPage(i)).getTextContent()).items.filter(it => it.str && it.str.trim()).map(it => ({s: it.str, x: it.transform[4], y: it.transform[5]}));
    items.sort((a, b) => b.y - a.y || a.x - b.x); const rows = [];
    for (const it of items) { const r = rows.find(r => Math.abs(r.y - it.y) < 3); r ? r.items.push(it) : rows.push({y: it.y, items: [it]}); }
    out += rows.sort((a, b) => b.y - a.y).map(r => r.items.sort((a, b) => a.x - b.x).map(x => x.s).join(" ")).join("\n") + "\n";
  }
  return out;
}

function md(src) {
  const lines = esc(src).split("\n"); let out = "", list = null;

  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }

}

function rules() {
  const nm = S.profile?.name || "el usuario";
  return `Actúas como entrenador personal y asesor de nutrición deportiva de ${nm} dentro de su app "Registro de Cargas". Responde siempre en español de España, de tú, directo y cercano, como un buen entrenador de gimnasio.
- Basa cada consejo en sus datos reales (abajo). Cita cifras concretas: kg, reps, fechas, % de grasa, kcal.
- Progresión: usa doble progresión (cuando completa todas las series en el tope de reps con buena técnica, sube la carga el mínimo posible: 1-2,5 kg en máquinas y mancuernas). Ten en cuenta la sensación registrada (Fácil, Bien, Duro, Al fallo) y la energía.
- Adapta el enfoque a su fase actual: en déficit o recomposición, mantener fuerza y masa muscular con proteína alta; en mantenimiento, rendimiento y progresión estable; en superávit, ganar músculo minimizando la grasa. Si te pide objetivos para una fase nueva, propón kcal y gramos de proteína, grasa e hidratos justificados con su peso y actividad.
- Ten en cuenta sus notas generales (fatiga, horarios, molestias): son información que quiere que recuerdes siempre.
- Ten en cuenta su horario de trabajo: en semanas de tarde suele entrenar por la mañana y en semanas de mañana por la tarde; los días de teletrabajo entrena en casa con la rutina de casa. Ajusta volumen, horario de comidas y descanso a su turno (tienes el horario de cada código de turno).
- Los pesajes son revisiones con su entrenador del gimnasio en las que mide su composición corporal y reajustan ejercicios. Si se acerca uno, ayúdale a preparar qué preguntar y qué revisar; después, analiza el resultado frente a sus objetivos.
- Si pregunta por su EVOLT, explícalo en lenguaje sencillo: qué significa cada dato, qué está en rango y qué no, cómo ha cambiado desde el escaneo anterior y qué hacer (entreno y comida). Compara la recomendación de EVOLT con sus macros objetivo.
- Pulso: algunas sesiones traen PULSO (del reloj). Úsalo para juzgar la intensidad real (pesas vs cardio, descansos, zonas) y la recuperación; compáralo entre sesiones del mismo día de rutina. Su pulso máximo estimado es ${hrMax()} ppm.
- Comidas del día: usa su OBJETIVO DIARIO y lo que lleva HOY para calcular lo que le queda (kcal y gramos de proteína, hidratos y grasas). Cuando pregunte qué comer, propone las siguientes comidas que encajen en lo que le queda, según la hora y su turno de trabajo (cuántas comidas le quedan, cena ligera si es tarde, comida transportable si trabaja presencial), con cantidades en gramos y macros aproximados de cada plato. Prioriza llegar a la proteína.
- En nutrición da ejemplos prácticos con comida española habitual y cantidades aproximadas.
- Si menciona dolor, lesión, mareo u otro síntoma médico, recomienda parar y consultar con un profesional sanitario; no diagnostiques.
- Sé breve: 4-10 líneas salvo que pida un plan detallado. Usa listas cortas con guiones y **negrita** solo para lo clave. No uses tablas.

DATOS DE ${nm.toUpperCase()}:
`;
}
async function toImageBlock(file) {
  const img = await createImageBitmap(file); const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return {type: "image", source: {type: "base64", media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1]}};
}
async function askAnthropic(turns, signal, files) {
  if (files && files.length) { const last = turns[turns.length - 1]; turns = [...turns.slice(0, -1), {role: "user", content: [...await Promise.all(files.map(toImageBlock)), {type: "text", text: last.content}]}]; }
  const res = await fetch("https://api.anthropic.com/v1/messages", {method: "POST", signal,
    headers: {"content-type": "application/json", "x-api-key": S.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
    body: JSON.stringify({model: S.apiModel || DEFAULT_MODEL, max_tokens: 1500, messages: turns})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw {code: res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : "api", message: data?.error?.message || ""};
  return (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
}

/* ---------- copia automática en Google Drive ----------
   Tras cada cambio (sesión, medición, EVOLT, comida, rutinas…) se sube «Registro de Cargas.xlsx» y
   «copia_completa.json» a Exportaciones/Copia automática y se manda a la papelera la versión anterior.
   La primera copia de cada semana se conserva con su fecha como histórico. Estado en backup/auto. */
const weekStart = iso => isoAdd(iso, -((wdOf(iso) + 6) % 7));
function dataHash() {
  const d = backupData().docs; delete d["chat/main"]; const str = JSON.stringify(Object.keys(d).sort().map(k => [k, d[k]]));

}
const backupOn = () => HOSTED && !!S.mcp && !!S.profile?.drive?.exports?.id && S.backup?.enabled !== false;
function dataTick() { if (abReady) scheduleBackup(6000); }

    }

function backupData() {

  Object.entries(S.plans).forEach(([k, v]) => docs["plan/" + k] = v);
  if (S.profile) docs["profile/main"] = S.profile;
  S.body.forEach(b => docs["body/" + b.id] = strip(b));

  S.daily.forEach(d => docs["daily/" + d.id] = strip(d));

  if (S.mobility) docs["mobility/main"] = S.mobility;

async function restoreBackup(obj) {
  if (obj?.app !== "registro-de-cargas" || typeof obj.docs !== "object") throw new Error("formato");
  const ok = /^(plan|profile|body|logs|daily|videos|chat|evolt|mobility)\/[A-Za-z0-9_\-.~:@+]+$/;
  const entries = Object.entries(obj.docs).filter(([p, d]) => ok.test(p) && d && typeof d === "object" && !Array.isArray(d));
  for (let i = 0; i < entries.length; i += 5) await Promise.all(entries.slice(i, i + 5).map(([p, d]) => S.db.doc(p).set(d)));

document.addEventListener("toggle", ev => { const m = /^mob-(warm|stretch)$/.exec(ev.target.id || ""); if (m) { S.mobOpen = S.mobOpen || {}; S.mobOpen[m[1]] = ev.target.open; } }, true);
document.addEventListener("toggle", ev => { if (ev.target.id === "evImp") S.evOpen = ev.target.open; }, true);
document.addEventListener("toggle", ev => { if (ev.target.id === "rangeBox") S.rangeOpen = ev.target.open; }, true);
document.addEventListener("toggle", ev => { if (ev.target.id === "prevDetails") lsSet("rc.prevOpen", ev.target.open); }, true);
document.addEventListener("keydown", ev => { if (ev.target.id === "ask" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(ev.target.value); } });

/* ---------- datos ---------- */
let rTimer; const soon = () => { clearTimeout(rTimer); rTimer = setTimeout(() => { const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && (S.tab !== "prog" || S.hrEdit)) return; render(); }, 30); };
render();
/* Versión independiente instalada desde GitHub Pages: registra el service worker (instalable y sin conexión). */
if (!HOSTED && "serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(async () => {
  let db = null, sample = null, mcp = null, assets = null;
  if (HOSTED) [db, sample, mcp, assets] = await Promise.all(["db", "sample", "mcp", "assets"].map(n => claude.use(n).catch(() => null)));
  else db = localDB();
  S.sample = sample; S.db = db; S.mcp = mcp; S.assets = assets;
  if (sample) sample.limits().then(l => { S.imgCaps = l?.images || null; if (S.tab === "coach") render(); }).catch(() => {}); S.dbState = db ? "on" : "off"; if (!mcp) S.vMode = "link";
  if (!db) { render(); return; }
  const err = () => {};
  db.collection("videos").onSnapshot(s => { S.videos = {}; s.docs.forEach(d => S.videos[d.id] = d.data()); soon(); migrateLegacyVideos(); }, err);
  db.doc("calendar/main").onSnapshot(s => { S.cal = s.exists ? s.data() : null; S.calLoaded = true; autoPlace(); soon(); maybeAutoSync(); }, err);
  db.doc("calendar/gcal").onSnapshot(s => { S.gcalMap = s.exists ? (s.data().days || {}) : {}; soon(); }, err);
  db.doc("calendar/overrides").onSnapshot(s => { S.calOv = s.exists ? (s.data().days || {}) : {}; autoPlace(); soon(); }, err);
  db.collection("daily").orderBy("date", "desc").limit(400).onSnapshot(s => { S.daily = s.docs.map(d => ({id: d.id, ...d.data()})); soon(); dataTick(); }, err);
  db.collection("plan").onSnapshot(s => { S.plans = {}; s.docs.forEach(d => S.plans[d.id] = d.data()); soon(); dataTick(); }, err);
  db.doc("profile/main").onSnapshot(s => { S.profile = s.exists ? s.data() : null; S.profileLoaded = true; soon(); if (S.tab === "evolt") evAuto(); }, err);
  db.doc("backup/auto").onSnapshot(s => { S.backup = s.exists ? s.data() : null; if (S.tab === "me") soon(); }, err);
  db.doc("mobility/main").onSnapshot(s => { S.mobility = s.exists ? s.data() : null; soon(); dataTick(); }, err);
  db.collection("evolt").onSnapshot(s => { S.evolt = s.docs.map(d => ({id: d.id, ...d.data()})); soon(); dataTick(); }, err);
  db.collection("body").onSnapshot(s => { S.body = s.docs.map(d => ({id: d.id, ...d.data()})); soon(); dataTick(); }, err);
  db.collection("logs").orderBy("createdAt", "desc").limit(400).onSnapshot(s => { S.logs = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt - a.createdAt); soon(); dataTick(); }, err);
  setTimeout(() => { abReady = true; scheduleBackup(500); }, 8000);
  db.doc("chat/main").get().then(s => { if (s.exists && !S.chat.length) { S.chat = (s.data().turns || []).slice(); soon(); } }).catch(() => {});
  render();
})();
})();
