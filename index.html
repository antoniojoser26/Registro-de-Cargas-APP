<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FD1">
<meta name="description" content="Registro de entrenamientos de fuerza, composición corporal, nutrición y entrenador con IA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Registro de Cargas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna, pensada para el móvil en el gimnasio; barra de pestañas fija abajo. Color de acento = disco azul de 20 kg, rojo = disco de 25 kg. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E7EBF1; --ink:#141922; --muted:#5A6475; --line:#D8DEE7;
  --accent:#1F4FD1; --accent-soft:#E2E9FB; --on-accent:#FFFFFF;
  --plate-red:#C3352C; --good:#1F7F55; --good-soft:#DDF1E7; --warn:#A76A12; --warn-soft:#F7EBD6; --red-soft:#F8E1DF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#161A21; --sunk:#1D222B; --ink:#E7EAF0; --muted:#97A1B2; --line:#2A303B;
  --accent:#7196FF; --accent-soft:#1D2A4D; --on-accent:#0B1020;
  --plate-red:#F0695E; --good:#4CC38A; --good-soft:#15342A; --warn:#E2AA4E; --warn-soft:#3A2D16; --red-soft:#3D1F1D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --sunk:#1D222B; --ink:#E7EAF0; --muted:#97A1B2; --line:#2A303B;
  --accent:#7196FF; --accent-soft:#1D2A4D; --on-accent:#0B1020;
  --plate-red:#F0695E; --good:#4CC38A; --good-soft:#15342A; --warn:#E2AA4E; --warn-soft:#3A2D16; --red-soft:#3D1F1D;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin-bottom:14px}
section+section{margin-top:26px}

/* controles */
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--plate-red)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
textarea.input{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* pills de estado */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.up{background:var(--red-soft);color:var(--plate-red)}
.pill.keep{background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* registro */
.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daypick button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;min-width:120px}
.daypick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.daypick b{display:block;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.daypick span{font-size:12px;color:var(--muted)}
.daypick .next{color:var(--accent);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-h h3{font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:0;line-height:1.3}
.ex-meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex-tip{font-size:13px;margin-top:6px;color:var(--ink);background:var(--sunk);border-radius:6px;padding:5px 8px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px 8px;align-items:center;margin-top:12px}
.sets .hd{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.sets .n{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;background:var(--surface)}
.step button{border:0;background:var(--sunk);width:38px;font-size:18px;font-weight:600;flex:0 0 auto}
.step input{border:0;background:transparent;text-align:center;width:100%;min-width:0;padding:8px 2px;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.step input::placeholder{color:var(--muted);opacity:.6}
.feel{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.feel .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.addset{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:6px 0}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.10)}

/* rutina */
.day{border-top:1px solid var(--line);padding-block:14px}
.day:first-of-type{border-top:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.extable{width:100%;border-collapse:collapse;font-size:14px}
.extable td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.extable tr:first-child td{border-top:0}
.extable td.r{text-align:right;white-space:nowrap}
.extable .nm{font-weight:600}
.extable .sub{font-size:12.5px;color:var(--muted)}
.editbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:2px 0}
.tbl-wrap{overflow-x:auto}
.ref{width:100%;border-collapse:collapse;font-size:13.5px}
.ref th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.ref td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .d{font-size:12.5px;margin-top:4px;font-family:var(--f-mono)}
.d.pos{color:var(--good)} .d.neg{color:var(--plate-red)} .d.neu{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.hist{display:flex;flex-direction:column}
.hist .it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.hist .it:first-child{border-top:0}
details.sess{border-top:1px solid var(--line);padding-block:10px}
details.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sess summary::-webkit-details-marker{display:none}
.sess ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:220px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p,.msg.a p+ol,.msg.a ol+p{margin-top:8px}
.msg.a ul,.msg.a ol{margin:6px 0;padding-left:20px}
.msg.a .h{font-weight:600;margin-top:8px}
.msg.think{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.composer .box{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:46px;max-height:160px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:500;z-index:9;max-width:calc(100% - 32px)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
.vex{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:6px}
.vex:first-of-type{border-top:0}
.vitem{background:var(--sunk);border-radius:8px;padding:8px 10px}
.vadd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:4px}
.vlinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vlinks a,.vlinks button{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:4px 10px;text-decoration:none}
.nutbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.nutbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.nutbar i.over{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.msg,.ex{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div><div class="eyebrow">Fuerza · progreso · nutrición</div><h1>Registro de Cargas</h1></div></div>
  <div class="empty">Cargando tu rutina, tus mediciones y tu historial…</div>
</div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = (n, d = 1) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("es-ES", {maximumFractionDigits: d, minimumFractionDigits: 0});
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = (iso, opt) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("es-ES", opt || {day: "numeric", month: "short"}); };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* Dentro de Claude la app usa la base de datos privada del artifact; fuera (p. ej. GitHub Pages) usa el almacenamiento local del navegador. */
const HOSTED = !!(window.claude && typeof window.claude.use === "function");
const DEFAULT_MODEL = "claude-sonnet-5-5";
function localDB() {
  const KEY = "rc.db"; let data = lsGet(KEY) || {}; const subs = new Set();
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { toast("El navegador no tiene espacio para guardar más datos. Exporta una copia."); } subs.forEach(f => f()); };
  const snap = path => { const has = Object.prototype.hasOwnProperty.call(data, path); return {id: path.split("/").pop(), exists: has, data: () => has ? JSON.parse(JSON.stringify(data[path])) : undefined}; };
  const docRef = path => ({id: path.split("/").pop(), path,
    get: async () => snap(path),
    set: async d => { data[path] = JSON.parse(JSON.stringify(d)); persist(); },
    update: async d => { data[path] = {...(data[path] || {}), ...JSON.parse(JSON.stringify(d))}; persist(); },
    delete: async () => { delete data[path]; persist(); },
    onSnapshot(fn) { const run = () => fn(snap(path)); subs.add(run); setTimeout(run); return () => subs.delete(run); }});
  const coll = (name, q = {}) => {
    const docs = () => { let ks = Object.keys(data).filter(k => k.startsWith(name + "/") && !k.slice(name.length + 1).includes("/")).map(snap);
      if (q.f) ks.sort((a, b) => { const x = a.data()[q.f], y = b.data()[q.f]; return (x > y ? 1 : x < y ? -1 : 0) * (q.dir === "desc" ? -1 : 1); });
      if (q.n) ks = ks.slice(0, q.n); return {docs: ks, size: ks.length, empty: !ks.length}; };
    return {path: name, doc: id => docRef(name + "/" + (id || rid())), add: async d => { const r = docRef(name + "/" + rid()); await r.set(d); return r; },
      orderBy: (f, dir) => coll(name, {...q, f, dir}), limit: n => coll(name, {...q, n}), get: async () => docs(),
      onSnapshot(fn) { const run = () => fn(docs()); subs.add(run); setTimeout(run); return () => subs.delete(run); }};
  };
  addEventListener("storage", e => { if (e.key === KEY) { data = lsGet(KEY) || {}; subs.forEach(f => f()); } });
  return {doc: docRef, collection: coll};
}
const S = {
  db: null, sample: null, dbState: "loading", canWrite: true,
  plans: {}, profile: null, body: [], logs: [], chat: [],
  tab: lsGet("rc.tab") || "log",
  place: "gym", dayIdx: null, date: todayISO(), draft: null,
  rPlace: "gym", editing: null,
  metric: "weight", source: "all", exSel: null, exMetric: "top",
  busy: false, ctl: null, confirmClear: false, confirmDel: null,
  mcp: null, assets: null, videos: {}, vPlace: "gym", vAdd: null, vMode: "drive", driveFiles: null, driveState: "idle", driveErr: "", uploading: false,
  daily: [], nutMetric: "kcal", importing: "",
  editMe: false, editMacros: false, confirmImport: false, pendingImport: null, profileLoaded: false, editDay: null, exporting: "", exportBusy: false,
  apiKey: lsGet("rc.apikey") || "", apiModel: lsGet("rc.model") || ""
};

const TABS = [
  ["log", "Registrar", '<path d="M4 12h3M17 12h3M7 8v8M17 8v8M9.5 10v4M14.5 10v4M9.5 12h5"/>'],
  ["plan", "Rutinas", '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'],
  ["vid", "Vídeos", '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'],
  ["prog", "Progreso", '<path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/>'],
  ["coach", "Entrenador", '<path d="M5 18l-1 3 4-2h9a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v9"/><path d="M9 10h6M9 13h4"/>'],
  ["me", "Perfil", '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>']
];

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- helpers de rutina ---------- */
const isCardio = n => /cardio/i.test(n);
function parseTarget(t) {
  const count = +((t || "").match(/(\d+)\s*series?/i) || [])[1] || 3;
  const inner = ((t || "").match(/\(([^)]*)\)/) || [])[1] || "";
  const reps = inner.split("-").map(s => s.trim()).filter(Boolean).map(s => parseInt(s));
  return Array.from({length: count}, (_, i) => isNaN(reps[i]) ? null : reps[i]);
}
function parseKg(str) {
  if (!str) return [];
  let m = [...String(str).matchAll(/(\d+(?:[.,]\d+)?)\s*kg/gi)].map(x => parseFloat(x[1].replace(",", ".")));
  if (!m.length) m = [...String(str).matchAll(/\d+(?:[.,]\d+)?/g)].map(x => parseFloat(x[0].replace(",", ".")));
  return m;
}
const unitOf = str => /lado/i.test(str || "") ? "kg por lado" : /total/i.test(str || "") ? "kg total" : "kg";
function lastEntry(place, name) {
  for (const l of S.logs) { if (l.place !== place) continue; const e = (l.entries || []).find(e => e.n === name && (e.sets || []).some(s => s.kg != null && s.kg !== "")); if (e) return {log: l, e}; }
  return null;
}
/* Lunes = Día 1 … Viernes = Día 5. Sábado y domingo: descanso (null). */
function weekdayIdx(place, iso) {
  const days = S.plans[place]?.days || []; const [y, m, d] = (iso || todayISO()).split("-").map(Number);
  const wd = new Date(y, m - 1, d).getDay(); // 0 domingo … 6 sábado
  if (wd === 0 || wd === 6) return null;
  return wd - 1 < days.length ? wd - 1 : null;
}
function buildDraft() {
  const day = S.plans[S.place]?.days?.[S.dayIdx]; if (!day) return null;
  return {place: S.place, day: day.name, date: S.date, energy: null, note: "",
    entries: day.ex.map(x => {
      if (isCardio(x.n)) return {n: x.n, cardio: true, min: parseInt(x.t) || 30, detail: x.note || "", feel: "", note: ""};
      const reps = parseTarget(x.t); const prev = lastEntry(S.place, x.n);
      const kgs = prev ? prev.e.sets.map(s => s.kg) : parseKg(x.last);

/* ---------- gráficas ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(4));
  return t;
}
function lineChart(pts, {unit = "", dec = 1} = {}) {
  if (pts.length < 1) return `<div class="empty">Sin datos todavía.</div>`;
  const W = 640, H = 230, L = 46, R = 18, T = 14, B = 30;
  const xs = pts.map(p => new Date(p.x + "T00:00").getTime()), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys)); const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = `${path}L${X(xs[xs.length - 1]).toFixed(1)},${Y(y0)}L${X(xs[0]).toFixed(1)},${Y(y0)}Z`;
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${fmtN(t, dec)}</text>`).join("");
  const nx = Math.min(pts.length, 5), xl = [];
  for (let k = 0; k < nx; k++) { const i = nx === 1 ? 0 : Math.round(k * (pts.length - 1) / (nx - 1)); if (!xl.includes(i)) xl.push(i); }
  const xlab = xl.map((i, k) => `<text x="${X(xs[i])}" y="${H - 8}" text-anchor="${k === 0 && xl.length > 1 ? "start" : k === xl.length - 1 && xl.length > 1 ? "end" : "middle"}">${fmtDate(pts[i].x)}</text>`).join("");
  const dots = pts.map((p, i) => `<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"><title>${fmtDate(p.x)}: ${fmtN(p.y, dec)} ${unit}${p.src ? " · " + p.src : ""}</title></circle>`).join("");
  const last = pts[pts.length - 1];
  const lx = X(xs[xs.length - 1]), anchor = lx > W - 90 ? "end" : "start";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">${grid}<path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>${dots}
    <text x="${anchor === "end" ? lx - 9 : lx + 9}" y="${Y(last.y) - 9}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:600">${fmtN(last.y, dec)} ${unit}</text>${xlab}</svg>`;
}

/* ---------- Samsung Health ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ""));
}
function shTable(text) {
  let rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length && /^com\.samsung/i.test(rows[0][0]) && rows[0].length < 5) rows = rows.slice(1); // línea de metadatos
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().split(".").pop().toLowerCase());
  return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
function shDate(v) {
  if (v == null || v === "") return null;
  if (/^\d{11,}$/.test(String(v).trim())) { const d = new Date(+v); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}
async function importSamsung(files) {
  const texts = []; // [{name, text}]
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) { toast("No se pudo abrir el ZIP. Descomprímelo y elige los CSV."); continue; }
      const zip = await JSZip.loadAsync(f);
      for (const [name, entry] of Object.entries(zip.files)) if (!entry.dir && /(step_daily_trend|pedometer_day_summary|health\.nutrition)[^/]*\.csv$/i.test(name)) texts.push({name, text: await entry.async("string")});
    } else if (/\.csv$/i.test(f.name)) texts.push({name: f.name, text: await f.text()});
  }
  const days = {}; const day = d => days[d] ||= {date: d};
  let steps = 0, meals = 0;
  const hasTrend = texts.some(t => /step_daily_trend/i.test(t.name));
  for (const {name, text} of texts) {
    const rows = shTable(text);
    if (/step_daily_trend/i.test(name) || (!hasTrend && /pedometer_day_summary/i.test(name))) {
      for (const r of rows) { const d = shDate(r.day_time || r.create_time); const n = parseInt(r.count ?? r.step_count); if (!d || isNaN(n)) continue; const o = day(d); o.steps = Math.max(o.steps || 0, n); steps++; }
    } else if (/health\.nutrition/i.test(name)) {
      for (const r of rows) { const d = shDate(r.start_time || r.create_time); if (!d) continue; const o = day(d); meals++;
        for (const [k, col] of [["kcal", "calorie"], ["protein", "protein"], ["fat", "total_fat"], ["carbs", "carbohydrate"]]) { const n = parseFloat(r[col]); if (!isNaN(n)) o[k] = (o[k] || 0) + n; } }
    }
  }
  const cutoff = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const list = Object.values(days).filter(d => d.date >= cutoff && d.date <= todayISO());
  return {list, steps, meals, files: texts.length};
}
async function writeDaily(list, source) {

      const out = {...prev, ...d, source}; delete out.id;

function md(src) {
  const lines = esc(src).split("\n"); let out = "", list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, '<span class="num">$1</span>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += `<p class="h">${inline(m[1])}</p>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}

async function askAnthropic(turns, signal) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {method: "POST", signal,
    headers: {"content-type": "application/json", "x-api-key": S.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
    body: JSON.stringify({model: S.apiModel || DEFAULT_MODEL, max_tokens: 1500, messages: turns})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw {code: res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : "api", message: data?.error?.message || ""};
  return (data.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
}
async function send(text) {
  text = (text || "").trim(); if (!text || S.busy) return;
  if (!coachReady()) { toast(HOSTED ? "Abre la app dentro de Claude para usar el entrenador." : "Añade tu clave de la API en Perfil → Entrenador IA."); return; }
  S.chat.push({role: "user", content: text}); S.askDraft = ""; S.busy = true; S.liveText = ""; S.confirmClear = false; S.tab = "coach"; render();
  S.ctl = new AbortController();
  const turns = [{role: "user", content: rules() + context()}, {role: "assistant", content: "Entendido. Tengo todos tus datos delante. ¿En qué te ayudo?"}, ...S.chat.slice(-20).map(t => ({role: t.role, content: t.content}))];
  try {
    let out;
    if (S.sample) ({text: out} = await S.sample(turns, {cache: false, signal: S.ctl.signal, onText: ({text}) => { S.liveText = text; const el = $("#live"); if (el) { el.classList.remove("think"); el.innerHTML = md(text); el.scrollIntoView({block: "end"}); } }}));
    else out = await askAnthropic(turns, S.ctl.signal);
    S.chat.push({role: "assistant", content: out});
  } catch (e) {
    if (e?.name === "AbortError") e = {code: "cancelled"};
    if (e?.text) S.chat.push({role: "assistant", content: e.text + (e.code === "cancelled" ? "\n\n*(respuesta detenida)*" : "\n\n*(respuesta interrumpida)*")});
    const msg = {not_granted: "No se ha dado permiso para usar Claude en esta app.", rate_limited: "Demasiadas preguntas seguidas. Prueba en un rato.", refused: "No puedo responder a eso. Prueba a reformularlo.", session_expired: "Tu sesión ha caducado: vuelve a iniciar sesión.", bad_key: "La clave de la API no es válida. Revísala en Perfil.", api: "La API respondió con un error: " + (e?.message || ""), cancelled: null}[e?.code];
    if (msg !== null) toast(msg || "No se pudo obtener respuesta. Inténtalo de nuevo.");
  }
  S.busy = false; S.liveText = ""; render(); persistChat();
}

function csv(rows) {
  const cell = v => { if (v == null) return ""; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return rows.map(r => r.map(cell).join(",")).join("\n") + "\n";
}
function buildExport() {
  const place = p => p === "home" ? "casa" : "gimnasio";
  const logs = [...S.logs].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0));
  const series = [["fecha", "lugar", "dia", "ejercicio", "serie", "kg", "reps", "reps_objetivo", "sensacion", "nota_ejercicio", "energia_sesion", "nota_sesion", "id_sesion"]];
  const cardio = [["fecha", "lugar", "dia", "ejercicio", "minutos", "detalle", "sensacion", "nota", "id_sesion"]];
  for (const l of logs) for (const e of l.entries || []) {
    if (e.cardio) cardio.push([l.date, place(l.place), l.day, e.n, e.min, e.detail, e.feel, e.note, l.id]);
    else (e.sets || []).forEach((s, i) => series.push([l.date, place(l.place), l.day, e.n, i + 1, s.kg, s.reps, s.tgt, e.feel, e.note, l.energy, l.note, l.id]));
  }
  const body = [["fecha", "peso_kg", "grasa_pct", "musculo_kg", "imc", "fuente", "nota"], ...[...S.body].sort((a, b) => a.date.localeCompare(b.date)).map(b => [b.date, b.weight, b.fat, b.muscle, b.weight ? +bmi(b.weight).toFixed(1) : "", b.source, b.note])];
  const daily = [["fecha", "pasos", "kcal", "proteina_g", "grasa_g", "hidratos_g", "fuente"], ...[...S.daily].sort((a, b) => a.date.localeCompare(b.date)).map(d => [d.date, d.steps, d.kcal, d.protein, d.fat, d.carbs, d.source])];
  const plans = [["rutina", "dia", "orden", "ejercicio", "objetivo", "ultimo_peso", "notas", "tecnica", "progresion"]];
  for (const [k, p] of Object.entries(S.plans)) (p.days || []).forEach(d => d.ex.forEach((x, i) => plans.push([place(k), d.name, i + 1, x.n, x.t, x.last, x.note, x.tip, x.prog])));
  return [
    {name: "series.csv", mime: "text/csv", text: csv(series)},
    {name: "cardio.csv", mime: "text/csv", text: csv(cardio)},
    {name: "composicion_corporal.csv", mime: "text/csv", text: csv(body)},
    {name: "nutricion_y_pasos.csv", mime: "text/csv", text: csv(daily)},
    {name: "rutinas.csv", mime: "text/csv", text: csv(plans)},
    {name: "copia_completa.json", mime: "application/json", text: JSON.stringify(backupData(), null, 2)}
  ];
}
const stamp = () => { const d = new Date(); return todayISO() + " " + String(d.getHours()).padStart(2, "0") + "." + String(d.getMinutes()).padStart(2, "0"); };
async function exportToDrive() {
  const exp = S.profile?.drive?.exports; if (!S.mcp || !exp?.id) return;
  S.exporting = "Creando carpeta…"; S.exportBusy = true; render();
  const call = (input) => S.mcp.callTool("Google Drive", "create_file", input, {cache: false});
  try {
    const folder = (await call({title: stamp(), contentMimeType: "application/vnd.google-apps.folder", parentId: exp.id})).payload;
    if (!folder?.id) throw {code: "tool_error", message: "sin id de carpeta"};
    const files = buildExport();
    for (let i = 0; i < files.length; i++) {
      S.exporting = `Subiendo ${files[i].name} (${i + 1}/${files.length})…`; const el = $("#expState"); if (el) el.textContent = S.exporting;
      await call({title: files[i].name, parentId: folder.id, textContent: files[i].text, contentMimeType: files[i].mime, disableConversionToGoogleType: true});
    }
    await saveProfile({...S.profile, lastExport: {at: new Date().toISOString(), url: folder.viewUrl || ""}});
    S.exporting = ""; toast("Registros exportados a Drive");
  } catch (e) {
    S.exporting = {server_not_connected: "Google Drive no está conectado. Añádelo en claude.ai → Ajustes → Conectores.", needs_reauth: "Vuelve a conectar Google Drive en claude.ai → Ajustes → Conectores.", not_in_manifest: "No has dado permiso a esta app para escribir en Google Drive.", server_unavailable: "Google Drive no responde. Comprueba la carpeta antes de repetir: puede haberse creado a medias.", tool_error: "Drive devolvió un error: " + (e?.message || "")}[e?.code] || "No se pudo completar la exportación. Comprueba la carpeta en Drive antes de repetir.";
  }

}
async function exportZip() {
  if (!window.JSZip) { toast("No se pudo preparar el ZIP."); return; }
  const zip = new JSZip(); buildExport().forEach(f => zip.file(f.name, f.text));
  const blob = await zip.generateAsync({type: "blob"});
  const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `registro-de-cargas ${stamp()}.zip`; document.body.append(link); link.click(); link.remove();
}

/* ---------- copia de seguridad ---------- */
function backupData() {
  const docs = {}; const strip = o => { const c = {...o}; delete c.id; return c; };
  Object.entries(S.plans).forEach(([k, v]) => docs["plan/" + k] = v);
  if (S.profile) docs["profile/main"] = S.profile;
  S.body.forEach(b => docs["body/" + b.id] = strip(b));
  S.logs.forEach(l => docs["logs/" + l.id] = strip(l));
  S.daily.forEach(d => docs["daily/" + d.id] = strip(d));
  Object.entries(S.videos).forEach(([k, v]) => docs["videos/" + k] = {...v, items: (v.items || []).filter(i => i.kind !== "asset")});
  if (S.chat.length) docs["chat/main"] = {turns: S.chat.slice(-40)};
  return {app: "registro-de-cargas", version: 1, exportedAt: new Date().toISOString(), docs};
}
async function restoreBackup(obj) {
  if (obj?.app !== "registro-de-cargas" || typeof obj.docs !== "object") throw new Error("formato");
  const ok = /^(plan|profile|body|logs|daily|videos|chat)\/[A-Za-z0-9_\-.~:@+]+$/;
  const entries = Object.entries(obj.docs).filter(([p, d]) => ok.test(p) && d && typeof d === "object" && !Array.isArray(d));
  for (let i = 0; i < entries.length; i += 5) await Promise.all(entries.slice(i, i + 5).map(([p, d]) => S.db.doc(p).set(d)));
  if (obj.docs["chat/main"]?.turns) S.chat = obj.docs["chat/main"].turns.slice();
  return entries.length;
}

const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
async function saveSession() {
  if (!S.db) return; const d = S.draft;
  const entries = d.entries.map(e => e.cardio ? {n: e.n, cardio: true, min: num(e.min), detail: e.detail || "", feel: e.feel, note: e.note}
    : {n: e.n, sets: e.sets.filter(s => s.kg != null || s.reps != null).map(s => ({kg: num(s.kg), reps: num(s.reps), tgt: s.tgt ?? null})), feel: e.feel, note: e.note})
    .filter(e => e.cardio ? e.min || e.feel || e.note : e.sets.length);
  if (!entries.length) { toast("Apunta al menos un ejercicio antes de guardar."); return; }
  const btn = document.querySelector('[data-act="saveSession"]'); btn && (btn.disabled = true);
  try {
    await S.db.collection("logs").add({date: d.date || todayISO(), place: d.place, day: d.day, entries, energy: d.energy, note: d.note || "", createdAt: Date.now()});
    // actualizar "último peso" y sugerencia de progresión en el plan
    const plan = JSON.parse(JSON.stringify(S.plans[d.place])); const day = plan.days.find(x => x.name === d.day);
    if (day) for (const e of entries) { if (e.cardio) continue; const x = day.ex.find(x => x.n === e.n); if (!x) continue;
      const kgs = [...new Set(e.sets.map(s => s.kg).filter(k => k != null))];
      if (kgs.length) { const u = unitOf(x.last); x.last = kgs.map(k => fmtN(k)).join(" / ") + "kg" + (u === "kg" ? "" : u.replace("kg", "")); }
      const hit = e.sets.length && e.sets.every(s => s.reps != null && s.tgt != null && s.reps >= s.tgt);
      if (x.prog !== "N/A") x.prog = hit && (e.feel === "Fácil" || e.feel === "Bien") ? "Sí, subir" : "Mantener"; }
    await S.db.doc("plan/" + d.place).set(plan);
    try { localStorage.removeItem("rc.draft"); } catch {}
    S.draft = null; S.dayIdx = null; toast("Sesión guardada"); S.tab = "prog"; lsSet("rc.tab", S.tab); render(); scrollTo(0, 0);
  } catch (e) { btn && (btn.disabled = false); toast(e?.code === "quota_exceeded" ? "No queda espacio para más sesiones." : "No se pudo guardar. Revisa la conexión e inténtalo de nuevo."); }
}

  if (a === "importData2") {
    S.confirmImport = false;
    try { const n = await restoreBackup(JSON.parse(await S.pendingImport.text())); toast(`Copia importada: ${n} registros`); }
    catch { toast("El archivo no es una copia válida de Registro de Cargas."); }
    render(); return;
  }
  if (a === "addRem") { const t = $("#newrem").value.trim(); if (!t) return; const p = JSON.parse(JSON.stringify(S.profile)); p.reminders = [...(p.reminders || []), t]; await saveProfile(p); toast("Recordatorio añadido"); return; }
  if (a === "addNote") { const t = $("#newnote").value.trim(); if (!t) return; const p = JSON.parse(JSON.stringify(S.profile)); p.notes = [...(p.notes || []), {text: t, status: "Pendiente"}]; await saveProfile(p); return; }
});
document.addEventListener("input", ev => {
  const t = ev.target, ds = t.dataset;
  if (ds.kg || ds.reps) { const [i, j] = (ds.kg || ds.reps).split("-").map(Number); S.draft.entries[i].sets[j][ds.kg ? "kg" : "reps"] = num(t.value); saveDraftLocal(); }
  else if (ds.min != null) { S.draft.entries[+ds.min].min = num(t.value); saveDraftLocal(); }
  else if (ds.det != null) { S.draft.entries[+ds.det].detail = t.value; saveDraftLocal(); }
  else if (ds.enote != null) { S.draft.entries[+ds.enote].note = t.value; saveDraftLocal(); }
  else if (t.id === "snote") { S.draft.note = t.value; saveDraftLocal(); }
  else if (t.id === "sdate") { S.draft.date = t.value; saveDraftLocal(); }
  else if (t.id === "ask") { S.askDraft = t.value; t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; }
});
document.addEventListener("change", ev => { if (ev.target.id === "exsel") { S.exSel = ev.target.value; render(); } });
document.addEventListener("keydown", ev => { if (ev.target.id === "ask" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(ev.target.value); } });

/* ---------- datos ---------- */
let rTimer; const soon = () => { clearTimeout(rTimer); rTimer = setTimeout(() => { const a = document.activeElement; if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && S.tab !== "prog") return; render(); }, 30); };
render();
/* Versión independiente instalada desde GitHub Pages: registra el service worker (instalable y sin conexión). */
if (!HOSTED && "serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(async () => {
  let db = null, sample = null, mcp = null, assets = null;
  if (HOSTED) [db, sample, mcp, assets] = await Promise.all(["db", "sample", "mcp", "assets"].map(n => claude.use(n).catch(() => null)));
  else db = localDB();
  S.sample = sample; S.db = db; S.mcp = mcp; S.assets = assets; S.dbState = db ? "on" : "off"; if (!mcp) S.vMode = "link";
  if (!db) { render(); return; }
  const err = () => {};
  db.collection("videos").onSnapshot(s => { S.videos = {}; s.docs.forEach(d => S.videos[d.id] = d.data()); soon(); }, err);
  db.collection("daily").orderBy("date", "desc").limit(400).onSnapshot(s => { S.daily = s.docs.map(d => ({id: d.id, ...d.data()})); soon(); }, err);
  db.collection("plan").onSnapshot(s => { S.plans = {}; s.docs.forEach(d => S.plans[d.id] = d.data()); soon(); }, err);
  db.doc("profile/main").onSnapshot(s => { S.profile = s.exists ? s.data() : null; S.profileLoaded = true; soon(); }, err);
  db.collection("body").onSnapshot(s => { S.body = s.docs.map(d => ({id: d.id, ...d.data()})); soon(); }, err);
  db.collection("logs").orderBy("createdAt", "desc").limit(400).onSnapshot(s => { S.logs = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt - a.createdAt); soon(); }, err);
  db.doc("chat/main").get().then(s => { if (s.exists && !S.chat.length) { S.chat = (s.data().turns || []).slice(); soon(); } }).catch(() => {});
  render();
})();
})();
</script>
